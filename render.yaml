# ==============================================================================
# Urban Loom — Render Infrastructure Blueprint (render.yaml)
# ==============================================================================
# This blueprint defines both the backend Web Service and the frontend
# Static Site. Render will automatically detect this file when you connect
# your GitHub repository as a "Blueprint" in Render Dashboard.
#
# Documentation: https://render.com/docs/blueprint-spec
# ==============================================================================

version: "1"

services:
  # ----------------------------------------------------------------------------
  # 1. Backend Web Service (Node.js Express 5 API)
  # ----------------------------------------------------------------------------
  - type: web
    name: urban-loom-backend
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: ACCESS_TOKEN_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRY
        value: 1d
      - key: REFRESH_TOKEN_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_EXPIRY
        value: 7d
      - key: IMAGEKIT_PUBLIC_KEY
        sync: false
      - key: IMAGEKIT_PRIVATE_KEY
        sync: false
      - key: IMAGEKIT_URL_ENDPOINT
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false

  # ----------------------------------------------------------------------------
  # 2. Frontend Static Site (React 19 / Vite / Tailwind CSS v4)
  # ----------------------------------------------------------------------------
  - type: static
    name: urban-loom-frontend
    plan: free
    region: oregon
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
